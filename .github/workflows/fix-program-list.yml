name: Fix program list

on:
  push:
    paths:
      - '.github/workflows/fix-program-list.yml'

permissions:
  contents: write

jobs:
  update-program-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct program entries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text()

          # Remove Volunteer & Stewardship from the program data.
          text, removed = re.subn(
              r",\{id:'volunteer',name:'Volunteer & Stewardship Opportunities'.*?pilot:0,cost:0\}",
              "",
              text,
              count=1,
          )

          # Ensure Estuary Life and Landforms exists and place it near the front
          # of the general program list so it is immediately visible.
          pattern = r"\{id:'estuary-life-landforms',name:'Estuary Life and Landforms'.*?fieldTrip:1\}"
          match = re.search(pattern, text)
          if match:
              entry = match.group(0)
              text = text[:match.start()] + text[match.end():]
              anchor = "{id:'sound-sprouts'"
              pos = text.find(anchor)
              if pos == -1:
                  raise SystemExit('Could not find program list anchor.')
              text = text[:pos] + entry + "," + text[pos:]
          else:
              entry = "{id:'estuary-life-landforms',name:'Estuary Life and Landforms',category:'School Field Experience',grades:['5'],gradeLabel:'Grade 5',audiences:['School or classroom','Youth organization','Educator'],settings:['At the Estuarium','At a beach or park'],format:'Hands-on field trip and historic shoreline investigation',summary:'Students investigate the historic shorelines of Budd Inlet and Capitol Lake, the role of sediment in an estuary, Olympia oysters, dredging, and human-caused changes through hands-on science, landform modeling, and a guided shoreline walk.',tags:['Grade 5','Landforms','Historic shoreline'],pilot:0,cost:1,fieldTrip:1}"
              anchor = "{id:'sound-sprouts'"
              pos = text.find(anchor)
              if pos == -1:
                  raise SystemExit('Could not find program list anchor.')
              text = text[:pos] + entry + "," + text[pos:]

          path.write_text(text)
          print(f'Removed volunteer entries: {removed}')
          PY
      - name: Commit corrected program list
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show Estuary Life and Landforms and remove volunteer listing'
          git push
