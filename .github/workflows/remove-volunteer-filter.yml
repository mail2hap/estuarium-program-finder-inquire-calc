name: Remove volunteer filter option

on:
  push:
    paths:
      - '.github/workflows/remove-volunteer-filter.yml'

permissions:
  contents: write

jobs:
  update-program-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove volunteer filter option
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          text = text.replace('<option>Volunteer & Stewardship</option>', '')
          path.write_text(text)
          PY
      - name: Commit filter correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove Volunteer and Stewardship filter option'
          git push
